[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aicollabhub-server"
version = "0.1.0"
description = "Platform backend for the AI collaboration portal"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    # 标准依赖包含 FastAPI CLI，支持使用 fastapi dev 启动开发服务。
    "fastapi[standard]>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
# 指定模块中的应用实例，使项目根目录下的 fastapi dev 无需额外参数。
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
