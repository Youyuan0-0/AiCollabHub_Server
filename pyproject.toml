[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aicollabhub-server"
version = "0.1.0"
description = "Platform backend for the AI collaboration portal"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "minio>=7.2.20,<8",
    "psycopg[binary]>=3.3.5,<4",
    "pydantic-settings>=2.7,<3",
    "redis>=7.4.1,<8",
    "sqlalchemy>=2.0,<2.1",
    "urllib3>=2.2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
