[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aicollabhub-server"
version = "0.1.0"
description = "Platform backend for the AI collaboration portal"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aliyun-python-sdk-core>=2.16,<3",
    "alembic>=1.14,<2",
    "defusedxml>=0.7.1,<1",
    # 标准依赖包含 CLI 和 multipart 解析，支持开发启动及旧问答表单接口。
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "minio>=7.2.20,<8",
    "psycopg[binary]>=3.3.5,<4",
    "pydantic-settings>=2.7,<3",
    # 知识库解析 PDF 和旧版 Excel；OOXML 格式复用受限 XML 解析器。
    "pypdf>=6,<7",
    "xlrd>=2.0.1,<3",
    "redis>=7.4.1,<8",
    "sqlalchemy>=2.0,<2.1",
    "urllib3>=2.2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.31,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
# 项目根目录执行 fastapi dev 时使用此应用入口。
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    # 业务代码的命名、公共说明及函数类型与代码规范保持一致。
    "N801", "N802", "N803", "N806",
    "D101", "D102", "D103",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN204", "ANN205", "ANN206",
]

[tool.ruff.lint.per-file-ignores]
# 新增规则约束应用源码；迁移、运维脚本和测试保留原有检查范围。
"tests/**" = ["ANN", "D", "N"]
"migrations/**" = ["ANN", "D", "N"]
"scripts/**" = ["ANN", "D", "N"]
"checks/**" = ["ANN", "D", "N"]
