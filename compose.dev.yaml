name: aicollabhub-dev

services:
  postgres:
    image: postgres:17
    # 单库开发使用普通提交；主备的 remote_apply 配置在部署阶段启用。
    command: ["postgres", "-c", "synchronous_commit=on"]
    environment:
      POSTGRES_DB: aicollabhub
      POSTGRES_USER: aicollabhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicollabhub -d aicollabhub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
